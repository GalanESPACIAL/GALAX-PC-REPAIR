  <script>
    (function () {
      const key = 'gx_cookie_consent';
      const banner = document.getElementById('cookieBanner');
      const choice = localStorage.getItem(key);
      if (!choice) banner.style.display = 'block';
      document.getElementById('cookieAccept').addEventListener('click', function () { localStorage.setItem(key, 'all'); banner.style.display = 'none'; });
      document.getElementById('cookieEssential').addEventListener('click', function () { localStorage.setItem(key, 'essential'); banner.style.display = 'none'; });
